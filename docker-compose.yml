# ============================================================
# GridVeritas – isolated Docker Compose stack
# Own network: gridveritas-net (no clash with other containers)
# ============================================================
#
# Usage:
#   docker compose up -d --build
#   docker compose down
#   docker compose down -v   # also remove DB + Ollama volumes
#
# UI:   http://localhost:3080
# API:  http://localhost:18080/api/v1/...
# ============================================================

name: gridveritas

services:

  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: gridveritas-postgres
    environment:
      POSTGRES_DB: gridveritas
      POSTGRES_USER: gridveritas
      POSTGRES_PASSWORD: gridveritas
    volumes:
      - gridveritas-pgdata:/var/lib/postgresql/data
    networks:
      - gridveritas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridveritas -d gridveritas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Ollama (local LLM server for the audit assistant) ----------
  ollama:
    image: ollama/ollama:latest
    container_name: gridveritas-ollama
    environment:
      # Keep the model in RAM only briefly after a query, so it does not sit
      # resident permanently on an 8 GiB host.
      OLLAMA_KEEP_ALIVE: "60s"
    volumes:
      - gridveritas-ollama:/root/.ollama
    networks:
      - gridveritas-net
    # mem_limit: 4g   # uncomment to cap; a 1B model needs ~1.5 GiB while loaded
    restart: unless-stopped

  # ---------- One-shot: pull the model, then exit ----------
  ollama-pull:
    image: ollama/ollama:latest
    container_name: gridveritas-ollama-pull
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://gridveritas-ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "waiting for ollama server...";
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        echo "pulling ${OLLAMA_MODEL:-llama3.2:1b}...";
        ollama pull ${OLLAMA_MODEL:-llama3.2:1b};
        echo "model ready.";
    networks:
      - gridveritas-net
    restart: "no"

  # ---------- Core (Spring Boot) ----------
  core:
    build:
      context: ./gridveritas-core
      dockerfile: Dockerfile
    image: gridveritas/core:local
    container_name: gridveritas-core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gridveritas
      # runtime: limited, append-only-enforced role
      SPRING_DATASOURCE_USERNAME: gridveritas_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app-change-me}
      # migrations: run as the table owner (full DDL)
      SPRING_FLYWAY_USER: gridveritas
      SPRING_FLYWAY_PASSWORD: gridveritas
      # consumed by Flyway init-sqls to create the runtime role with this password
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-change-me}
      OLLAMA_URL: http://gridveritas-ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      # --- M8 security (change these for anything beyond local dev) ---
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-secret}
      READ_KEY: ${READ_KEY:-dev-read-key-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-change-me}
      INGEST_PASSWORD: ${INGEST_PASSWORD:-ingest-change-me}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gridveritas-net
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ---------- UI (React + nginx) ----------
  ui:
    build:
      context: ./gridveritas-ui
      dockerfile: Dockerfile
    image: gridveritas/ui:local
    container_name: gridveritas-ui
    depends_on:
      core:
        condition: service_healthy
    networks:
      - gridveritas-net
    ports:
      - "3080:80"
    restart: unless-stopped

  # ---------- Edge agent (optional: docker compose --profile edge up -d) ----------
  edge:
    build:
      context: ./gridveritas-edge
      dockerfile: Dockerfile
    image: gridveritas/edge:local
    container_name: gridveritas-edge
    profiles: ["edge"]
    environment:
      GRIDVERITAS_CORE_URL: http://gridveritas-core:8080
      GRIDVERITAS_AGENT_NAME: edge-agent-01
      GRIDVERITAS_INTERVAL: 15s
      # dev: admin creds let the agent register its source AND ingest.
      # prod: use ingest creds + a pre-provisioned GRIDVERITAS_SOURCE_ID.
      GRIDVERITAS_AUTH_USER: admin
      GRIDVERITAS_AUTH_PASSWORD: ${ADMIN_PASSWORD:-admin-change-me}
    depends_on:
      core:
        condition: service_healthy
    networks:
      - gridveritas-net
    restart: unless-stopped


  # ---------- Demo data seeder (one-shot: docker compose --profile seed run --rm seed) ----------
  seed:
    build:
      context: ./gridveritas-edge
      dockerfile: Dockerfile.seed
    image: gridveritas/seed:local
    container_name: gridveritas-seed
    profiles: ["seed"]
    environment:
      GRIDVERITAS_CORE_URL: http://gridveritas-core:8080
      ADMIN_USER: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-change-me}
      SEED_READINGS: "24"
      SEED_INTERVAL_MIN: "60"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - gridveritas-net
    restart: "no"

networks:
  gridveritas-net:
    name: gridveritas-net
    driver: bridge

volumes:
  gridveritas-pgdata:
    name: gridveritas-pgdata
  gridveritas-ollama:
    name: gridveritas-ollama
