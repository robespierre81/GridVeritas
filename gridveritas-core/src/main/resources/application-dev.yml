# Optional profile for local development with H2 (no PostgreSQL required)
# Start with:  --spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:h2:mem:gridveritas;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
