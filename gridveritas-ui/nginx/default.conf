server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls through Traefik (load-balances across core replicas,
    # ADR-013) rather than a fixed core container name/address - a static
    # proxy_pass here would resolve once at startup and keep talking to a
    # single replica even when core is scaled.
    location /api/ {
        proxy_pass http://traefik/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
